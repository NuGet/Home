id: 
name: GitOps.PullRequestIssueManagement.P3Cleanup
description: Auto-close stale icebox issues with low community interest and handle triage escalation
owner: 
resource: repository
disabled: false
where: 
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
    - description: Add Icebox cleanup candidate label to inactive issues not excluded from cleanup
      frequencies:
      - daily:
          time: 20:0
      filters:
      - isIssue
      - isOpen
      - hasLabel:
          label: Status:Inactive
      - isNotLabeledWith:
          label: Status:Excluded from icebox cleanup
      - isNotLabeledWith:
          label: Icebox cleanup candidate
      - isNotLabeledWith:
          label: Triage:NeedsTriageDiscussion
      actions:
      - addLabel:
          label: Icebox cleanup candidate
      - addReply:
          reply: >-
            Due to lack of recent activity, this issue has been marked as a candidate for icebox cleanup. It will be closed if no further activity occurs within 14 more days. Any new comment (by anyone, not necessarily the author) will add a `Triage:NeedsTriageDiscussion` label and lead to a triaging discussion.
            This process is part of the experimental stale icebox issues cleanup we are currently trialing. Please share any feedback you might have in the linked issue.
    - description: Auto-close icebox cleanup candidate issues after 14 days with no activity
      frequencies:
      - daily:
          time: 22:0
      filters:
      - isIssue
      - isOpen
      - hasLabel:
          label: Icebox cleanup candidate
      - noActivitySince:
          days: 14
      - isNotLabeledWith:
          label: Triage:NeedsTriageDiscussion
      actions:
      - addReply:
          reply: >-
            This issue has been automatically closed after 14 days with no activity since being marked as an icebox cleanup candidate.
            If you believe this issue is still relevant, please reopen it with a comment explaining why.
      - closeIssue
    eventResponderTasks:
    - if:
      - payloadType: Issue_Comment
      - isAction:
          action: Created
      - hasLabel:
          label: Icebox cleanup candidate
      - isOpen
      then:
      - addLabel:
          label: Triage:NeedsTriageDiscussion
      - removeLabel:
          label: Icebox cleanup candidate
      description: Route icebox cleanup candidate issues to triage when someone comments
