id: 
name: GitOps.LabelReminder
description: Reminds issue authors and assignees to add labels such as Type label, if missing.
owner: 
resource: repository
disabled: false
where: 
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
    - description: '[20-10] Remind HotSeat to add Type label'
      frequencies:
      - daily:
          time: 12:0
      filters:
      - isOpen
      - isIssue
      - isNotLabeledWith:
          label: Type:Spec
      - isNotLabeledWith:
          label: Type:Test
      - isNotLabeledWith:
          label: Type:Feature
      - isNotLabeledWith:
          label: Type:Docs
      - isNotLabeledWith:
          label: Type:DCR
      - isNotLabeledWith:
          label: Type:Bug
      - isNotLabeledWith:
          label: Type:DeveloperDocs
      - isNotLabeledWith:
          label: Type:DataAnalysis
      - isNotLabeledWith:
          label: Type:Learning
      - isNotLabeledWith:
          label: Type:Tracking
      - isNotLabeledWith:
          label: Type:Engineering
      - isNotLabeledWith:
          label: Type:BreakingChange
      - isNotLabeledWith:
          label: missing-required-type
      - isNotLabeledWith:
          label: Priority:3
      - isNotLabeledWith:
          label: Epic
      actions:
      - addReply:
          reply: Issue is missing Type label, remember to add a [Type label](https://github.com/NuGet/Client.Engineering/blob/main/designs/nuget-issues-approach.md#issue-type)
      - addLabel:
          label: missing-required-type
    - description: '[20-30] Remind NuGet Client member (issue author) to add Type label'
      frequencies:
      - daily:
          time: 12:0
      filters:
      - isOpen
      - isIssue
      - isNotLabeledWith:
          label: Type:Spec
      - isNotLabeledWith:
          label: Type:Test
      - isNotLabeledWith:
          label: Type:Feature
      - isNotLabeledWith:
          label: Type:Docs
      - isNotLabeledWith:
          label: Type:DCR
      - isNotLabeledWith:
          label: Type:Bug
      - isNotLabeledWith:
          label: Type:DeveloperDocs
      - isNotLabeledWith:
          label: Type:DataAnalysis
      - isNotLabeledWith:
          label: Type:Learning
      - isNotLabeledWith:
          label: Type:Tracking
      - isNotLabeledWith:
          label: Type:Engineering
      - isNotLabeledWith:
          label: Type:BreakingChange
      - isNotLabeledWith:
          label: missing-required-type
      - isNotLabeledWith:
          label: Epic
      actions:
      - addReply:
          reply: '@${issueAuthor} Issue is missing Type label, remember to add a [Type label](https://github.com/NuGet/Client.Engineering/blob/main/designs/nuget-issues-approach.md#issue-type)'
      - addLabel:
          label: missing-required-type
    eventResponderTasks:
    - description: '[20-20] Remove "missing-required-type" if it has Type label'
      if:
      - payloadType: Issues
      - isAction:
          action: Labeled
      - hasLabel:
          label: missing-required-type
      - or:
        - hasLabel:
            label: Type:Spec
        - hasLabel:
            label: Type:Test
        - hasLabel:
            label: Type:Feature
        - hasLabel:
            label: Type:Docs
        - hasLabel:
            label: Type:DCR
        - hasLabel:
            label: Type:Bug
        - hasLabel:
            label: Type:DeveloperDocs
        - hasLabel:
            label: Type:DataAnalysis
        - hasLabel:
            label: Type:Learning
        - hasLabel:
            label: Type:Tracking
        - hasLabel:
            label: Type:Engineering
        - hasLabel:
            label: Type:BreakingChange
      then:
      - removeLabel:
          label: missing-required-type
onFailure: 
onSuccess: 
