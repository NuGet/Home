name: IceBox Upvote Watcher
on:
  # Run before 9am Seattle time, so discussion needed labels are added before the working day.
  # Run at non-zero minute so we're not running at the same time as everyone else who runs at the zero minute
  schedule:
    - cron: '34 13 * * *'
  # Allow manual triggering, so testing changes is easier
  workflow_dispatch:
    inputs:
      entrypyBranch:
        description: 'The Entropy repo branch to use'
        required: true
        default: 'main'

permissions:
  issues: write

jobs:
  Run-IceBox-Watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone Entropy
        env:
          BRANCH: ${{ inputs.entrypyBranch || 'main' }}
        run: |
          git clone https://github.com/NuGet/Entropy
          git -C Entropy switch $BRANCH

      - name: Install Latest .NET SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --install-dir $HOME/dotnet
          dotnet --info

      - name: Build GitHubIssueTagger
        working-directory: Entropy/GithubIssueTagger
        run: |
          dotnet build

      - name: Run IceBox Watcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: Entropy/GithubIssueTagger
        run: dotnet run -- IceBox --label "Priority:3"
